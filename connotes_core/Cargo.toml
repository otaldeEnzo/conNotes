[package]
name = "connotes_core"
version = "0.2.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
glam = "0.29"                    # Álgebra linear 2D/3D com SIMD
rstar = "0.12"                   # R-Tree 2D para indexação espacial
rayon = "1.10"                   # Paralelismo multi-thread
bincode = "1.3"                  # Serialização binária ultra-rápida
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
bumpalo = "3.16"                 # Arena allocator para hot-paths


[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "geometry_benchmarks"
harness = false
